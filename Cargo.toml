[package]
name = "inquiry"
version = "0.1.0"
edition = "2024"
description = "SQLx-backed query builders generated from Rust structs."
readme = "README.md"
rust-version = "1.85"
categories = ["database"]
keywords = ["sqlx", "postgres", "query-builder", "derive"]

[dependencies]
inquiry-macros = { version = "0.1.0", path = "crates/inquiry-macros" }

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-native-tls", "derive"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
trybuild = "1.0.116"
